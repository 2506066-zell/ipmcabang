<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#006400">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Akun - Kuis IPM</title>
    <link rel="icon" href="/ipm%20(2).png">
    <link rel="stylesheet" href="/app/css/style.css?v=6">
    <link rel="stylesheet" href="/app/css/profile.css">    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="page-auth page-register">
    <div class="login-screen">
        <div class="login-card">
            <div class="login-header">
                <img src="ipm%20(2).png" alt="Logo IPM" class="logo">
                <h1>Buat Akun Baru</h1>
                <p>Isi data dengan benar agar akun langsung bisa dipakai login.</p>
            </div>
            <form id="register-form" novalidate>
                <div class="input-group">
                    <label for="namaPanjang">Nama Panjang</label>
                    <input type="text" id="namaPanjang" name="namaPanjang" required placeholder="Nama lengkap Anda" autocomplete="name" enterkeyhint="next" aria-describedby="nama-field-error">
                    <small id="nama-field-error" class="field-error" role="status" aria-live="polite" hidden></small>
                </div>
                <div class="input-group">
                    <label for="pimpinan">Asal Pimpinan</label>
                    <select id="pimpinan" name="pimpinan" required aria-describedby="pimpinan-hint pimpinan-field-error">
                        <option value="">Memuat pilihan...</option>
                    </select>
                    <small id="pimpinan-hint" class="input-hint">Pilih asal pimpinan sesuai daftar.</small>
                    <small id="pimpinan-field-error" class="field-error" role="status" aria-live="polite" hidden></small>
                </div>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Username untuk login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-describedby="username-hint username-field-error">
                    <small id="username-hint" class="input-hint">Gunakan 3-30 karakter: huruf, angka, titik, garis bawah, atau strip.</small>
                    <small id="username-field-error" class="field-error" role="status" aria-live="polite" hidden></small>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required minlength="6" placeholder="Minimal 6 karakter" autocomplete="new-password" enterkeyhint="done" aria-describedby="password-hint password-field-error">
                        <button type="button" id="toggle-password" class="password-toggle" aria-label="Tampilkan password" aria-pressed="false" aria-controls="password"><i class="fas fa-eye"></i></button>
                    </div>
                    <small id="password-hint" class="input-hint">Minimal 6 karakter.</small>
                    <small id="password-field-error" class="field-error" role="status" aria-live="polite" hidden></small>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="Ulangi password" autocomplete="new-password" enterkeyhint="done" aria-describedby="confirm-password-field-error">
                        <button type="button" id="toggle-confirm-password" class="password-toggle" aria-label="Tampilkan password konfirmasi" aria-pressed="false" aria-controls="confirmPassword"><i class="fas fa-eye"></i></button>
                    </div>
                    <small id="confirm-password-field-error" class="field-error" role="status" aria-live="polite" hidden></small>
                </div>
                <button type="submit" class="btn-login" id="register-submit-btn">Daftar Akun</button>
                <p id="message" class="form-message" role="alert" aria-live="polite" hidden></p>
            </form>
            <div class="register-link">
                <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
            </div>
        </div>
    </div>
    <script src="scripts/loader.js" defer></script>
    <script src="/app/js/core/toast.js" defer></script>
    <script src="scripts/navguard.js" defer></script>
    <script src="scripts/auth-ui.js?v=3" defer></script>
    <script src="scripts/register.js?v=5" defer></script>    <script src="/app/js/core/profile.js" defer></script>
</body>
</html>
