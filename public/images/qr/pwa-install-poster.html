<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Install Aplikasi IPM</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --accent: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 15% 20%, #e8f5ee 0%, var(--bg) 60%);
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      padding: 24px;
    }
    .poster {
      width: min(1080px, 100%);
      aspect-ratio: 1 / 1;
      background: var(--card);
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(2, 6, 23, 0.10);
      padding: 56px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 30px);
      color: var(--muted);
      line-height: 1.45;
    }
    .qr-wrap {
      display: grid;
      place-items: center;
      gap: 20px;
    }
    .qr {
      width: min(62%, 640px);
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 16px;
      background: #fff;
    }
    .hint {
      font-size: clamp(18px, 2vw, 26px);
      color: var(--muted);
      text-align: center;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(16px, 1.4vw, 22px);
      color: var(--muted);
    }
    .cta {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="poster">
    <header>
      <h1>Scan untuk Install Aplikasi</h1>
      <p>PC IPM Panawuan • Buka langsung di HP, lalu pilih <b>Add to Home Screen</b>.</p>
    </header>

    <section class="qr-wrap">
      <img class="qr" src="./pwa-install-direct-ipmcabang-1600-dark.png" alt="QR Install Aplikasi IPM" />
      <p class="hint">Arahkan kamera ke QR, lalu buka link aplikasi</p>
    </section>

    <footer class="footer">
      <span>https://ipmcabang.vercel.app/install</span>
      <span class="cta">Gratis • Cepat • Ringan</span>
    </footer>
  </main>
</body>
</html>
